name: Generate blog post

on:
  # n8n (or anything else) can trigger this via the GitHub API:
  # POST /repos/Tim-s-Dev/jw-site-restyle/actions/workflows/generate-blog.yml/dispatches
  workflow_dispatch:
    inputs:
      category:
        description: "Force a category (optional): health-wellness-marketing | social-media-marketing | content-marketing-seo | video-content-strategy"
        required: false
        default: ""
  # Fallback schedule in case n8n is down: Mon/Wed/Fri 9:00 AM Central (14:00 UTC)
  schedule:
    - cron: "0 14 * * 1,3,5"

permissions:
  contents: write

concurrency:
  group: generate-blog
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate post
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UNSPLASH_ACCESS: ${{ secrets.UNSPLASH_ACCESS }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.category }}" ]; then
            node scripts/blog/generate-post.mjs --category "${{ github.event.inputs.category }}"
          else
            node scripts/blog/generate-post.mjs
          fi

      - name: Commit and push
        run: |
          git config user.name "Tim Simmons"
          git config user.email "timsimmons@journeywell.io"
          git add blog.html blog/
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "blog: scheduled post $(date -u +%Y-%m-%d)"
          git push origin main
